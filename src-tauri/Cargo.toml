[package]
name = "lockbox"
version = "1.0.0"
description = "Local-only TOTP/HOTP authenticator for macOS"
authors = ["unprofessional"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "lockbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependency policy (BRIEF §4, §14): no tauri plugins in M1, no http/fs/shell
# plugins ever. Any change here needs human review.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vault crypto (BRIEF §4, §6)
argon2 = { version = "0.6", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
zeroize = { version = "1.9", features = ["derive"] }
# QR import from images (BRIEF §7.2): PNG/JPEG decode only, greyscale fed
# straight to rqrr (its own image integration off).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = { version = "0.11", default-features = false }
totp-rs = { version = "6", default-features = false, features = ["std", "zeroize"] }

# Clipboard (BRIEF §4): NSPasteboard directly, already in Tauri's dependency
# tree, instead of tauri-plugin-clipboard-manager. See src/clipboard.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }

[dev-dependencies]
tempfile = "3"
# Generates real QR images for the qr.rs tests.
qrcode = { version = "0.14", default-features = false }
# Mock runtime for the IPC contract tests in lib.rs.
tauri = { version = "2", features = ["test"] }

# Argon2id at 64 MiB is unbearably slow unoptimized; keep dev unlocks fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lockbox</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main id="lock-screen" class="lock-screen">
      <form id="unlock-form" class="unlock-card" autocomplete="off">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <rect x="5" y="10.5" width="14" height="10" rx="2" />
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
          </svg>
        </div>
        <h1>lockbox</h1>
        <label class="visually-hidden" for="password">Master password</label>
        <input
          id="password"
          type="password"
          placeholder="Master password"
          spellcheck="false"
          autofocus
        />
        <button type="submit">Unlock</button>
        <p id="unlock-msg" class="unlock-msg" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
